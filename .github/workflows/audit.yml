name: security audit

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
