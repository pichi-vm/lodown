# cargo-deny configuration for lodown. License allowlist tailored to lodown's
# actual dependency tree (cargo metadata); adding a dep with another license
# fails CI.

[licenses]
allow = [
    "Apache-2.0",   # this crate + iocuddle
    "MIT",          # syn/quote/proc-macro2 (dual MIT/Apache); zerocopy OR-tree
    "Unicode-3.0",  # required by unicode-ident (AND expression)
]
confidence-threshold = 0.8

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path deps carry no version; don't flag them as wildcards.
allow-wildcard-paths = true

[sources]
# lodown depends only on crates.io packages.
unknown-registry = "deny"
unknown-git = "deny"
