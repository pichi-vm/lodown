[package]
name = "lodown"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Nathaniel McCallum <nathaniel.mccallum@amd.com>"]
license = "Apache-2.0"
description = "Attach files to Linux loop devices, without hand-packing ioctl structs."
repository = "https://github.com/pichi-vm/lodown"
homepage = "https://github.com/pichi-vm/lodown"
documentation = "https://docs.rs/lodown"
readme = "README.md"
keywords = ["linux", "loop", "loopback", "ioctl", "block-device"]
categories = ["os::unix-apis", "api-bindings"]
exclude = ["/.github", "/CONTRIBUTING.md"]

[dependencies]
iocuddle = "0.3"
zerocopy = { version = "0.8", features = ["derive"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
