[package]
name = "loopdev"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "High-level, iocuddle-based Linux loop-device ioctl layer."
repository = "https://github.com/pichi-vm/loopdev"
homepage = "https://github.com/pichi-vm/loopdev"
readme = "README.md"
keywords = ["linux", "loop", "loopback", "ioctl", "block-device"]
categories = ["os::unix-apis", "api-bindings"]
# The crate name `loopdev` is already taken on crates.io; keep this
# unpublished until the package is renamed to a free name.
publish = false

[dependencies]
iocuddle = "0.3"
zerocopy = { version = "0.8", features = ["derive"] }
thiserror = "2"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
