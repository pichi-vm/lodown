[package]
name = "lodown"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "High-level, iocuddle-based Linux loop-device ioctl layer."
repository = "https://github.com/pichi-vm/lodown"
homepage = "https://github.com/pichi-vm/lodown"
readme = "README.md"
keywords = ["linux", "loop", "loopback", "ioctl", "block-device"]
categories = ["os::unix-apis", "api-bindings"]

[dependencies]
iocuddle = "0.3"
zerocopy = { version = "0.8", features = ["derive"] }
